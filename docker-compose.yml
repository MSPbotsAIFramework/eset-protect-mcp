# Local debugging only. Credentials are supplied per-request via Headers by
# whichever client you use to hit this container (curl, Claude Desktop, the
# Gateway in production) -- they are never baked into this compose file.
services:
  eset-protect-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      MCP_HTTP_HOST: "0.0.0.0"
      MCP_HTTP_PORT: "8080"
