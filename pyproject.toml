[project]
name = "eset-protect-mcp"
version = "0.1.0"
description = "ESET PROTECT (ESET Connect) MCP server for the MSPbots Agent platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "MSPbots.ai" }]
dependencies = [
    "mcp[cli]>=1.9.0,<2.0.0",
    "httpx>=0.27,<1.0",
    "pydantic-settings>=2.4,<3.0",
    "uvicorn>=0.30,<1.0",
    "starlette>=0.38,<1.0",
]

[project.scripts]
eset-protect-mcp = "eset_protect_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eset_protect_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "respx>=0.21,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
